name: ci

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum

      - name: Check formatting
        run: test -z "$(gofmt -l $(find cmd internal -name '*.go'))"

  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum

      - name: Vet
        run: go vet ./...

  sqlc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum

      - name: Cache sqlc CLI
        id: cache-sqlc
        uses: actions/cache@v4
        with:
          path: ~/.cache/auth-go-tools/sqlc-v1.31.1
          key: ${{ runner.os }}-sqlc-v1.31.1

      - name: Install sqlc CLI
        if: steps.cache-sqlc.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/.cache/auth-go-tools/sqlc-v1.31.1
          curl -L https://github.com/sqlc-dev/sqlc/releases/download/v1.31.1/sqlc_1.31.1_linux_amd64.tar.gz | tar xvz
          mv sqlc ~/.cache/auth-go-tools/sqlc-v1.31.1/sqlc
          chmod +x ~/.cache/auth-go-tools/sqlc-v1.31.1/sqlc

      - name: Add sqlc to PATH
        run: echo "$HOME/.cache/auth-go-tools/sqlc-v1.31.1" >> "$GITHUB_PATH"

      - name: Generate SQLC
        run: make sqlc

      - name: Verify generated code
        run: git diff --exit-code

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum

      - name: Test unit suite
        run: go test ./...

  integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: auth_go
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 3s
          --health-timeout 3s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum

      - name: Cache migrate CLI
        id: cache-migrate
        uses: actions/cache@v4
        with:
          path: ~/.cache/auth-go-tools/migrate-v4.18.2
          key: ${{ runner.os }}-migrate-v4.18.2

      - name: Install migrate CLI
        if: steps.cache-migrate.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/.cache/auth-go-tools/migrate-v4.18.2
          curl -L https://github.com/golang-migrate/migrate/releases/download/v4.18.2/migrate.linux-amd64.tar.gz | tar xvz
          mv migrate ~/.cache/auth-go-tools/migrate-v4.18.2/migrate
          chmod +x ~/.cache/auth-go-tools/migrate-v4.18.2/migrate

      - name: Add migrate to PATH
        run: echo "$HOME/.cache/auth-go-tools/migrate-v4.18.2" >> "$GITHUB_PATH"

      - name: Run integration tests
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/auth_go?sslmode=disable
          JWT_ACCESS_SECRET: ci-test-access-secret
          REFRESH_TOKEN_HASH_KEY: ci-test-refresh-hash-key
          ENVIRONMENT: test
          DOMAIN: localhost
        run: make integration

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum

      - name: Build
        run: go build ./cmd/auth-go

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Cache Docker layers
        uses: actions/cache@v4
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-buildx-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-buildx-

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: auth-go:ci
          cache-from: type=local,src=/tmp/.buildx-cache
          cache-to: type=local,dest=/tmp/.buildx-cache-new,mode=max

      - name: Move cache
        run: |
          rm -rf /tmp/.buildx-cache
          mv /tmp/.buildx-cache-new /tmp/.buildx-cache
